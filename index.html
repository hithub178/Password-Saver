<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Saver</title>
<link rel="icon" href="logo.png">
    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;

            color: white;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    #ff4ecd 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    #7c3aed 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    #ff7a18 0%,
                    transparent 40%
                ),
                #140021;

            position: relative;
        }


        /* =========================
           ANIMATED BACKGROUND
        ========================= */

        body::before {

            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            background: #ff4ecd;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.35;

            top: -100px;
            left: -100px;

            animation:
                moveBlob 8s infinite alternate ease-in-out;

            z-index: -1;
        }


        body::after {

            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            background: #7c3aed;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.35;

            bottom: -120px;
            right: -100px;

            animation:
                moveBlob2 10s infinite alternate ease-in-out;

            z-index: -1;
        }


        @keyframes moveBlob {

            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(180px, 120px) scale(1.3);
            }

        }


        @keyframes moveBlob2 {

            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-150px, -100px) scale(1.25);
            }

        }


        /* =========================
           CARD
        ========================= */

        .container {

            width: 100%;

            max-width: 450px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 22px;

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);

        }


        /* =========================
           TITLE
        ========================= */

        .title {

            text-align: center;

            font-size: clamp(32px, 7vw, 50px);

            font-weight: bold;

            margin-bottom: 40px;

            color: #ffffff;

            letter-spacing: 1px;

        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {

            margin-bottom: 25px;

        }


        /* =========================
           LABEL
        ========================= */

        .form-group label {

            display: block;

            margin-bottom: 9px;

            font-size: clamp(16px, 4vw, 20px);

            font-weight: bold;

            color: #ffffff;

        }


        /* =========================
           NORMAL INPUT
        ========================= */

        .input-box {

            width: 100%;

            padding: 14px 16px;

            font-size: 17px;

            color: #222;

            background: #ffffff;

            border: 2px solid transparent;

            border-radius: 10px;

            outline: none;

            transition: 0.3s;

        }


        .input-box::placeholder {

            color: #777;

        }


        .input-box:focus {

            border-color: #ff4ecd;

            box-shadow:
                0 0 15px rgba(255, 78, 205, 0.5);

        }


        /* =========================
           PASSWORD FIELD
        ========================= */

        .password-box {

            display: flex;

            align-items: center;

            width: 100%;

            background: white;

            border-radius: 10px;

            border: 2px solid transparent;

            overflow: hidden;

            transition: 0.3s;

        }


        .password-box:focus-within {

            border-color: #ff4ecd;

            box-shadow:
                0 0 15px rgba(255, 78, 205, 0.5);

        }


        .password-box .input-box {

            flex: 1;

            border: none;

            border-radius: 0;

            box-shadow: none;

            min-width: 0;

        }


        /* =========================
           SHOW / HIDE
        ========================= */

        .show-password {

            flex: 0 0 auto;

            padding: 10px 14px;

            border: none;

            background: transparent;

            color: #6d28d9;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

        }


        .show-password:hover {

            color: #ec4899;

        }


        /* =========================
           STATUS MESSAGE
        ========================= */

        .message {

            min-height: 24px;

            margin-top: 20px;

            text-align: center;

            font-size: 15px;

            font-weight: bold;

        }


        .success {

            color: #86efac;

        }


        .error {

            color: #fca5a5;

        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            display: flex;

            gap: 15px;

            margin-top: 30px;

        }


        button {

            flex: 1;

            padding: 14px 20px;

            border: none;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;

        }


        .submit {

            background:
                linear-gradient(
                    135deg,
                    #00c853,
                    #00e676
                );

            box-shadow:
                0 6px 18px rgba(0, 230, 118, 0.3);

        }


        .reset {

            background:
                linear-gradient(
                    135deg,
                    #ff1744,
                    #ff5252
                );

            box-shadow:
                0 6px 18px rgba(255, 23, 68, 0.3);

        }


        button:hover {

            transform: translateY(-3px);

        }


        button:active {

            transform: translateY(0);

        }


        button:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }


            .container {

                padding: 30px 22px;

                border-radius: 18px;

            }


            .title {

                margin-bottom: 30px;

            }


            .buttons {

                flex-direction: column;

            }


            button {

                width: 100%;

            }

        }


        /* =========================
           TABLET
        ========================= */

        @media (min-width: 481px)
               and (max-width: 900px) {

            .container {

                max-width: 500px;

                padding: 45px;

            }

        }

    </style>

</head>


<body>


    <div class="container">

        <div class="title">
            Registration
        </div>


        <form id="registrationForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    class="input-box"
                    id="name"
                    type="text"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="password-box">

                    <input
                        class="input-box"
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword">

                        Show

                    </button>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="submit"
                    id="submitButton">

                    Submit

                </button>


                <button
                    type="reset"
                    class="reset"
                    id="resetButton">

                    Reset

                </button>

            </div>


            <!-- STATUS -->

            <div
                id="message"
                class="message">
            </div>


        </form>

    </div>


    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">

        import { initializeApp }

        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        import {

            getFirestore,

            collection,

            addDoc

        }

        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        /* =========================
           FIREBASE CONFIG
        ========================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAaoX28jyGZ7nXEJ-v2XvVOWfcL9J1MmMI",

            authDomain:
                "form-data-ac810.firebaseapp.com",

            projectId:
                "form-data-ac810",

            storageBucket:
                "form-data-ac810.firebasestorage.app",

            messagingSenderId:
                "458983546039",

            appId:
                "1:458983546039:web:ffb5121cdefd3ac084c132",

            measurementId:
                "G-EPS5811L28"

        };


        /* =========================
           FIREBASE
        ========================== */

        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);


        /* =========================
           ELEMENTS
        ========================== */

        const form =
            document.getElementById(
                "registrationForm"
            );


        const nameInput =
            document.getElementById(
                "name"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        const resetButton =
            document.getElementById(
                "resetButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        /* =========================
           SHOW / HIDE PASSWORD
        ========================== */

        showPassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    showPassword.textContent =
                        "Hide";

                }

                else {

                    passwordInput.type =
                        "password";

                    showPassword.textContent =
                        "Show";

                }

            }
        );


        /* =========================
           SUBMIT
        ========================== */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                /* Check browser validation */

                if (!form.checkValidity()) {

                    form.reportValidity();

                    return;

                }


                const name =
                    nameInput.value.trim();


                const password =
                    passwordInput.value;


                /* Clear old message */

                message.textContent = "";

                message.className =
                    "message";


                /* Disable buttons */

                submitButton.disabled = true;

                resetButton.disabled = true;


                /* Show immediate feedback */

                submitButton.textContent =
                    "Saving...";


                try {

                    /* Save to Firestore */

                    await addDoc(

                        collection(
                            db,
                            "registrations"
                        ),

                        {

                            name: name,

                            password: password

                        }

                    );


                    /* Success */

                    message.textContent =
                        "✓ Registration saved successfully!";

                    message.className =
                        "message success";


                    /* Clear form */

                    form.reset();


                    /* Reset password visibility */

                    passwordInput.type =
                        "password";

                    showPassword.textContent =
                        "Show";

                }


                catch (error) {

                    console.error(error);


                    message.textContent =
                        "✕ Could not save. Please try again.";

                    message.className =
                        "message error";

                }


                finally {

                    /* Enable buttons */

                    submitButton.disabled = false;

                    resetButton.disabled = false;


                    submitButton.textContent =
                        "Submit";

                }

            }
        );


        /* =========================
           RESET
        ========================== */

        resetButton.addEventListener(
            "click",
            function() {

                message.textContent = "";

                message.className =
                    "message";


                passwordInput.type =
                    "password";

                showPassword.textContent =
                    "Show";

            }
        );

    </script>


</body>

</html>
